<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>《国富论》· 单知识点卡片 · 劳动分工</title>
<style>
@font-face{font-family:'LXGW WenKai';src:local('LXGW WenKai'),local('LXGWWenKai-Regular');font-display:swap}
</style>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" onerror="this.remove()">
<style>
  :root{
    --paper:#FBF6F0;
    --ink:#201914;
    --muted:#9C928A;
    --accent:#E0432E;
    --accent-soft:rgba(224,67,46,.06);
    --line:#6A6058;
    --card:#FFFDFA;
    --font-hand:"LXGW WenKai","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-hand);
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
    display:flex;justify-content:center;
    padding:48px 20px;
  }
  .card{
    width:100%;max-width:680px;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:40px 38px 36px;
  }
  /* 书名 + 基本信息 */
  .book-name{
    font-size:30px;font-weight:400;color:var(--accent);
    letter-spacing:.5px;
  }
  .book-meta{
    margin-top:6px;font-size:15px;color:var(--muted);
  }
  .divider{
    height:1px;background:var(--line);opacity:.35;
    margin:22px 0 20px;
  }
  /* 观点主题 */
  .topic{
    font-size:14px;color:var(--accent);
    letter-spacing:2px;margin-bottom:12px;
  }
  /* 原书观点 */
  .block-label{
    font-size:13px;color:var(--muted);
    letter-spacing:1px;margin:26px 0 10px;
  }
  .quote{
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;
    padding:16px 18px;
    font-size:18px;line-height:1.85;
  }
  .quote-source{
    display:block;margin-top:10px;
    font-size:13px;color:var(--muted);
  }
  /* 我的理解 */
  .mine{
    font-size:18px;line-height:1.9;
  }
  /* 关联 / 对比 */
  .relate{
    margin-top:26px;
    border-top:1px dashed var(--line);
    opacity:.6;padding-top:18px;
    font-size:15px;color:var(--muted);
  }
  .relate b{color:var(--ink);font-weight:400;}
</style>
</head>
<body>
  <div class="card">
    <!-- 书名 + 基本信息 -->
    <div class="book-name">《国富论》</div>
    <div class="book-meta">亚当·斯密 · 1776</div>

    <div class="divider"></div>

    <!-- 观点主题 -->
    <div class="topic">观点 · 劳动分工</div>

    <!-- 原书观点 -->
    <div class="block-label">书里的观点</div>
    <div class="quote">
      劳动生产力上最大的增进，以及运用劳动时所表现的更大的熟练、技巧和判断力，似乎都是分工的结果。
      <span class="quote-source">—— 亚当·斯密</span>
    </div>

    <!-- 我的理解 -->
    <div class="block-label">我的理解</div>
    <div class="mine">
      随着社会的发展，社会的分工就会越来越详细、越来越精细。你不可能一个人干很多人的活儿——当然也有可能，但那样做出来会比较糙。如果你想把一件事真正做好，尽量还是要靠团队的分工，发挥每个人的优势。这才是分工真正的意义。
    </div>

    <!-- 关联 / 对比（留白给其他书） -->
    <div class="relate">
      <b>关联 / 对比：</b>（可填其他书里相近或相反的观点，做对照笔记）
    </div>
  </div>
</body>
</html>
