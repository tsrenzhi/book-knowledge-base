<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>书籍知识图谱</title>
<style>
  *{box-sizing:border-box}
  /* 径向渐变 · 中心亮四周深（克制立体感，无中间黑洞/图谱/光晕） */
  html,body{margin:0;height:100%;overflow:hidden;
    background: radial-gradient(circle at 50% 44%, #27374F 0%, #1A2238 48%, #0C1120 100%);
    background-attachment: fixed;
    color:#E8E6E2;
    font-family:"霞鹜文楷","LXGW WenKai",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  body.light{
    background: radial-gradient(circle at 50% 44%, #FFFCF5 0%, #F4EAD7 52%, #D6C5A6 100%);
    background-attachment: fixed;
    color:#201914;
  }
  #top{position:fixed;top:0;left:0;right:0;z-index:10;
    background:rgba(10,14,26,0.5);backdrop-filter: blur(10px);-webkit-backdrop-filter: blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);padding:10px 16px;display:flex;flex-wrap:wrap;
    align-items:center;gap:10px 18px}
  body.light #top{background:rgba(255,253,250,0.7);border-bottom:1px solid rgba(0,0,0,0.06)}
  #top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;color:#E8E6E2}
  body.light #top h1{color:#201914}
  #top .sub{font-size:12px;color:rgba(232,230,226,0.55)}
  body.light #top .sub{color:rgba(32,25,20,0.55)}
  #themeBtn{font-size:12px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:#E8E6E2;
    border-radius:14px;padding:4px 12px;cursor:pointer;font-family:inherit;transition:all .2s}
  #themeBtn:hover{background:rgba(255,255,255,0.12)}
  body.light #themeBtn{background:rgba(255,255,255,0.6);border:1px solid rgba(0,0,0,0.10);color:#201914}
  /* v25.29 搜索框（移植自 thinking-model growth-brain.html） */
  #searchWrap{position:relative;display:flex;align-items:center;flex:0 0 auto;min-width:0}
  #searchInput{font-size:11px;border:1px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.08);
    color:#E8E6E2;border-radius:16px;padding:5px 12px 5px 30px;width:170px;outline:none;transition:all .2s;font-family:inherit}
  #searchInput:focus{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.35);width:230px}
  body.light #searchInput{background:rgba(255,255,255,0.6);border:1px solid rgba(0,0,0,0.10);color:#201914}
  #searchIcon{position:absolute;left:10px;font-size:11px;opacity:.6;pointer-events:none}
  #searchDropdown{position:absolute;top:34px;left:0;width:100%;min-width:320px;max-height:360px;overflow-y:auto;
    background:rgba(10,14,26,0.92);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;display:none;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,0.5);min-width:170px}
  body.light #searchDropdown{background:rgba(255,253,250,0.96);border:1px solid rgba(0,0,0,0.08)}
  .searchItem{padding:5px 10px;cursor:pointer;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:6px;color:#E8E6E2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.light .searchItem{color:#201914;border-bottom:1px solid rgba(0,0,0,0.05)}
  .searchItem:hover{background:rgba(255,255,255,0.08)}
  body.light .searchItem:hover{background:rgba(0,0,0,0.05)}
  .searchItem .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  /* 书名优先 + 完整：flex:1 占用剩余空间，溢出才省略号；永不截断书名主体 */
  .searchItem .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  /* 作者次之：max-width 控住让书名能完整 */
  .searchItem .author{flex:0 1 auto;max-width:110px;font-size:9px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
  .searchEmpty{padding:12px;font-size:12px;opacity:.6;color:#E8E6E2}
  body.light .searchEmpty{color:#201914}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  /* v25.32 RC122：关系过滤单独 fixed 到右上角，PC显示/H5隐藏——顶栏右侧本来就挤到第二行左侧，违反用户明确「PC放右边/移动端不显示」的诉求 */
  #relFilters{position:fixed;top:14px;right:18px;z-index:11;display:flex;gap:4px;align-items:center;
    padding:5px 10px;background:rgba(10,14,26,0.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.08);border-radius:16px}
  body.light #relFilters{background:rgba(255,253,250,0.7);border-color:rgba(0,0,0,0.06)}
  @media (max-width:768px){#relFilters{display:none}}
  .filters label{font-size:12px;display:inline-flex;align-items:center;gap:5px;
    background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:14px;
    padding:3px 10px;cursor:pointer;color:#E8E6E2;transition:all .2s}
  .filters label:hover{background:rgba(255,255,255,0.10)}
  body.light .filters label{background:rgba(255,255,255,0.55);border:1px solid rgba(0,0,0,0.08);color:#201914}
  .filters input{display:none}
  .filters label .dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}
  .filters .cat-btn{user-select:none;cursor:pointer;transition:all .18s;position:relative}
  /* 默认：未选中 = 普通态 */
  .filters .cat-btn.active{background:rgba(255,255,255,0.22);border-color:rgba(255,255,255,0.7);font-weight:600}
  .filters .cat-btn.active .dot{transform:scale(1.30);box-shadow:0 0 16px currentColor, 0 0 4px rgba(255,255,255,0.65)}
  body.light .filters .cat-btn.active{background:rgba(32,25,20,0.16);border-color:rgba(32,25,20,0.55);font-weight:600}
  body.light .filters .cat-btn.active .dot{transform:scale(1.30);box-shadow:0 0 14px currentColor}
  /* v25.25 选中类别下 hl 高亮 / 其他保持原色（RC105：用户要"其他类保留可滚动探索"，不能暗化） */
  .node.hl circle{stroke-width:3.0;filter:drop-shadow(0 0 10px rgba(255,255,255,0.55));}
  body.light .node.hl circle{stroke-width:3.0;filter:drop-shadow(0 0 10px rgba(32,25,20,0.45));}
  /* 关系过滤（次要控件）—— 故意区别于 cat-btn：无胶囊框、无发光、字号小、前缀「连线」、off 态显示删除线+空心点 */
  .filters .rel-btn{user-select:none;cursor:pointer;font-size:11px;background:transparent;border:none;border-radius:0;
    padding:2px 7px 2px 8px;color:rgba(232,230,226,0.6);transition:color .15s}
  .filters .rel-btn:hover{color:rgba(232,230,226,0.95)}
  body.light .filters .rel-btn{color:rgba(32,25,20,0.55)}
  body.light .filters .rel-btn:hover{color:#201914}
  .filters .rel-btn .dot{width:8px;height:8px;box-shadow:none}
  .filters .rel-btn.off{text-decoration:line-through;color:rgba(232,230,226,0.30)}
  body.light .filters .rel-btn.off{color:rgba(32,25,20,0.30)}
  .filters .rel-btn.off .dot{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
  /* 关系过滤前置分隔符「连线」 */
  .filters .rel-prefix{font-size:11px;color:rgba(232,230,226,0.4);align-self:center;margin-left:6px;border-left:1px solid rgba(255,255,255,0.10);padding-left:10px}
  body.light .filters .rel-prefix{color:rgba(32,25,20,0.4);border-left-color:rgba(0,0,0,0.08)}
  #wrap{position:absolute;top:62px;left:0;right:0;bottom:0;min-height:80vh}
  svg{width:100%;height:100%;display:block;cursor:grab;min-height:80vh}
  svg:active{cursor:grabbing}
  /* .link stroke 完全交给 JS attr 设置（按关系色染色）—— CSS 这里只设 dim 透明度 */
  .link.dim{stroke-opacity:.04}
  /* 节点：实色 + 细白描边 + 柔和 drop-shadow（清亮不灰头） */
  .node circle{cursor:pointer;transition:filter .25s}
  .node.book circle{filter:drop-shadow(0 0 7px rgba(255,255,255,0.28))}
  .node.concept circle{filter:drop-shadow(0 0 4px rgba(255,255,255,0.16))}
  .node.referenced circle{stroke-dasharray:4 3;stroke:rgba(232,230,226,0.4);stroke-width:1.5px}
  body.light .node.referenced circle{stroke:rgba(60,50,40,0.35)}
  .node text{pointer-events:none;font-family:inherit}
  .node.book text{font-size:14px;font-weight:700;fill:#E8E6E2}
  body.light .node text{fill:#201914}
  .node.concept text{font-size:11px;font-weight:500;fill:rgba(232,230,226,0.8);text-anchor:middle}
  .node.dim{opacity:.12}
  .node.hl circle{filter:drop-shadow(0 0 16px rgba(255,255,255,0.6)) brightness(1.1)}
  #tip{position:fixed;max-width:360px;background:rgba(10,14,26,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.5;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);display:none;z-index:20;pointer-events:none;color:#E8E6E2;
    white-space:nowrap;word-break:keep-all;overflow:visible}
  body.light #tip{background:rgba(255,253,250,0.95);border:1px solid rgba(0,0,0,0.08);color:#201914}
  #hint{position:fixed;bottom:12px;left:16px;font-size:12px;color:rgba(232,230,226,0.4);z-index:10}
  body.light #hint{color:rgba(32,25,20,0.4)}
</style>
</head>
<body>
<div id="top">
  <div>
    <h1>书籍知识图谱</h1>
  </div>
  <button id="themeBtn">切浅色</button>
  <div id="searchWrap" autocomplete="off">
    <span id="searchIcon">🔎</span>
    <input id="searchInput" type="search" placeholder="搜索书名" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-form-type="other" data-lpignore="true"/>
    <div id="searchDropdown"></div>
  </div>
  <div class="filters" id="domainLegend" style="gap:8px"></div>
</div>
<div class="filters" id="relFilters" style="gap:8px;align-items:center;display:none"></div>
<div id="wrap"><svg id="svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg></div>
<div id="tip"></div>
<div id="hint">滚轮拉远看更多 · 拉近看细节 · 拖空白平移 · 双击复位</div>

<script src="./assets/d3.v7.min.js"></script>
<script type="module">
/* 内嵌 graph.json 兜底数据 — 双击 HTML 立即可用，无需 server */
const _EMBEDDED_GRAPH = /*EMBEDDED_GRAPH_DATA*/;;
let GRAPH = _EMBEDDED_GRAPH;
  let dataSource = '内嵌';
  try{
    const r = await fetch('./graph.json', {cache:'no-store'});
    if(r.ok){
      const fresh = await r.json();
      if(fresh && Array.isArray(fresh.nodes) && fresh.nodes.length){
        GRAPH = fresh;
        dataSource = 'fetch(最新)';
      }
    }
  }catch(e){ /* file:// 静默用内嵌 */ }
  console.log('[书籍知识图谱] 数据源:', dataSource, 'nodes:', GRAPH.nodes.length, 'links:', GRAPH.links.length);

const CARD_MAP = /*CARD_MAP*/;;
const REL_COLOR = GRAPH.meta.color_by_relation || {};
let dark = true;  /* 在 link 创建前定义，避免 stroke-opacity 用 undefined */
const CAT_COLOR = GRAPH.meta.category_colors || GRAPH.meta.group_colors || {};

const DASH = new Set(["相悖","批判"]);
const nodes = GRAPH.nodes.map(d=>Object.assign({},d));
const links = GRAPH.links.map(d=>Object.assign({},d));
const nodeById = new Map(nodes.map(n=>[n.id,n]));
links.forEach(l=>{ l.s=nodeById.get(l.source); l.t=nodeById.get(l.target); if(!l.s||!l.t) console.warn('broken link', l); });

// 度数（节点大小按连接数分层，制造主次/锚点感）
const deg = new Map(nodes.map(n=>[n.id,0]));
links.forEach(l=>{ const s=l.source,t=l.target; if(s!=null&&t!=null){ deg.set(s,(deg.get(s)||0)+1); deg.set(t,(deg.get(t)||0)+1); } });

let cw = document.getElementById("wrap").clientWidth || window.innerWidth;
let ch = document.getElementById("wrap").clientHeight || (window.innerHeight - 70);
if(cw < 400) cw = window.innerWidth || 1200;
if(ch < 300) ch = (window.innerHeight - 70) || 800;
const W = ()=>cw;
const H = ()=>ch;

// 节点大小：v25.16 回到 demo 配方 —— 书=22，概念=6+importance（参差 6~14）；视觉主次靠颜色/描边/文字撑起，不靠半径
const radius = n => {
  if(n.type === "book") return 22;
  if(n.status === "referenced") return 4;
  return 6 + (n.importance || 3);
};

/* 大类岛心 —— 把每个 category 放到一个椭圆环上 */
const catCenters = {};
const cats = Array.from(new Set(nodes.filter(n=>n.category && n.type==="book").map(n=>n.category)));  /* v25.36 只收书的分类，排除「跨类桥」概念节点的标识 category，不让它进图例 */
const catCount = Math.max(cats.length, 1);
cats.forEach((c,i)=>{
  const ang = (i / catCount) * Math.PI * 2;
  catCenters[c] = { x: Math.cos(ang) * 0.05, y: Math.sin(ang) * 0.04 };  /* v25.48f 椭圆 ±0.15/±0.12 -> ±0.05/±0.04 (中央±50px) - 根因: cats 顺序按 JSON 插入序, 大分类(50本)挤右下, 整图左空右密。现在让分类位置影响极小, 几乎不拉开距离 */
});

/* v25.16 推倒 v25.13/14/15 的"外推/锁中心"机制：删 conceptAnchor + per-book offset + 异化 init，回到 demo 默认
   真实规律：demo 之所以散得开，是因为**没有专属向心力、距离小、力强、charge 弱**——靠 link 自然约束，不靠额外力推 */
nodes.forEach(n=>{
  /* v25.48l 初始范围扩大 0.28 -> 0.42 (±400px @1920), 让刷新页面时节点先散开占满画布大半, 不会再挤成一坨. 用户原话 "密集恐惧症, 不要堆在一起, 稍微分散" */
  n.x = W()/2 + (Math.random()-0.5)*W()*0.42;
  n.y = H()/2 + (Math.random()-0.5)*H()*0.65;  /* 同步 H 方向 0.55 -> 0.65, 上下也散开 */
});

const svg = d3.select("#svg").attr("width", W()).attr("height", H())
  .attr("viewBox", `0 0 ${W()} ${H()}`)  /* RC125·v25.47.2d：viewBox 不带偏移 (-W*0.05...)，fitContent 的 translate(W/2 - cx*k, ...) 才正确生效 */
  .attr("preserveAspectRatio", "xMidYMid meet");
const viewport = svg.append("g").attr("class","viewport");

/* ===== v25.22 改动（RC102 · 应\"Obsidian 无限空间\"诉求）=====
   1) 删 forceBounds()：节点不再被强锁 viewport pad 内，可自由飞到画外
   2) center strength 1.0→0.05（默认极弱，不贴边）
   3) charge -340→-800（947 节点必须推开）
   4) link dist book-book 170→280 / book-concept 70→95 / concept-concept 55→65（小调整）
   5) link strength 0.5/0.7→0.20（弱约束，让散不被绑死）
   6) collide radius+8 → +10、strength 0.7→0.6
   7) viewBox 扩到 -W -H W*3 H*3（自由散出去的节点仍在画内）
   8) 初始 zoom scale 0.5（用户进图直接看大范围，用滚轮探索）
================================================================ */
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d=>d.id)
      .distance(l=> (l.s.type==="book"&&l.t.type==="book")?160 : (l.t.type==="book"?85:55))  /* v25.48l 55/40→85/55, book 周围概念不再堆成蜂窝; 140→160, book 之间也不挤 */
      .strength(l=> 0.45))  /* v25.48l 0.55→0.45, 弱化 link 黏性, 让 charge 自然推开 */
  .force("charge", d3.forceManyBody().strength(-240))  /* v25.48l -180→-240 推力加强, 让概念节点不再堆成蜂窝, 但仍比 demo -340 弱 (避免 v25.22 那种外散) */
  .force("center", d3.forceCenter(W()/2, H()/2).strength(0.45))  /* v25.48l 1.0→0.45, 不再强拉到 (960,505) 死堆, 留充电让 780 nodes 自然分散. 用户原话 "太过密集, 密集恐惧症" */
  /* v25.27 catCenters 大幅缩小到 0.08/0.06：v25.22 0.18/0.14 让 15 大类分散到画面边缘造成空旷，现在改"小岛心"让大类只在画面内松散聚拢，不挤向边缘 */
  .force("clusterX", d3.forceX(d=> d.type==="book" && d.category && catCenters[d.category] ? W()/2 + catCenters[d.category].x*Math.min(W(),H())*0.5  /* v25.48f catCenters.x=cos*0.05, [0.15,0.15]=±135px@1440×900 */ : W()/2).strength(0))  /* v25.48g cluster 完全关掉, 让 forceCenter 0.8 主导. 用户原话 "打开就在中央, 不能左半边空" */
  .force("clusterY", d3.forceY(d=> d.type==="book" && d.category && catCenters[d.category] ? H()/2 + catCenters[d.category].y*Math.min(W(),H())*0.5  /* v25.48f */ : H()/2).strength(0))  /* v25.48g 跟 clusterX 对齐 */
  .force("collide", d3.forceCollide().radius(d=>radius(d)+12).strength(0.7))
  .alpha(0.6)
  .alphaDecay(0.05)  /* v25.27：0.035→0.05 模拟器更快稳定，减少刷新卡顿 */
  /* RC125·v25.47.2：simulation 收敛后自动 fit-to-content，让"打开就居中"是默认态（用户原话"左边空这么多"） */
/* RC125 v25.48: 删 sim.on(end)+setTimeout 自动 fit. 打开就在中央, 只在双击时 fit */

/* v25.48 让节点起跑就在画布中央附近 (避免 "从边缘展开" 的突兀动画) */
/* v25.48l fallback 同步改 0.3 -> 0.5, 与主初始化一致 */
for(const n of nodes){ if(!isFinite(n.x) || !isFinite(n.y)){ n.x = W()/2 + (Math.random()-0.5)*W()*0.5; n.y = H()/2 + (Math.random()-0.5)*H()*0.6; } }

/* 缩放/平移 —— 让用户能飞进一团节点。
   v25.22：scaleExtent 改成 [0.05, 8] 支持更远缩放（Obsidian 风）；初始就是 scale 0.5 看大范围 */
const zoom = d3.zoom().scaleExtent([0.1, 6])
  .on("zoom", (e)=> viewport.attr("transform", e.transform));
/* RC125·v25.47.2 fitContent：算所有节点的包围盒，按 padding 自动 fit，让"打开就居中"是默认态（不靠 forceCenter 凑） */
function fitContent(pad=60){
  let xmin=Infinity,ymin=Infinity,xmax=-Infinity,ymax=-Infinity;
  let cnt=0;
  /* RC125·v25.47.2c：只 fit books（数量有限，可读），不算 concepts（1300+ 节点会把图压成米粒） */
  for(const n of nodes){
    if(n.type!=="book") continue;
    if(!isFinite(n.x)||!isFinite(n.y)) continue;
    const r = radius(n)+4;
    if(n.x-r<xmin) xmin=n.x-r; if(n.x+r>xmax) xmax=n.x+r;
    if(n.y-r<ymin) ymin=n.y-r; if(n.y+r>ymax) ymax=n.y+r;
    cnt++;
  }
  if(cnt===0) return;
  const bw=xmax-xmin, bh=ymax-ymin;
  if(bw<=0||bh<=0) return;
  let k = Math.min((W()-2*pad)/bw, (H()-2*pad)/bh);
  /* 下限：fit 后最小 0.85x（不要全图被压成米粒看不清字），上限 1.2x（不要让单个书占满屏） */
  if(k < 0.85) k = 0.85;
  if(k > 1.2) k = 1.2;
  const cx=(xmin+xmax)/2, cy=(ymin+ymax)/2;
  const t = d3.zoomIdentity.translate(W()/2 - cx*k, H()/2 - cy*k).scale(k);
  svg.transition().duration(450).call(zoom.transform, t);
}
/* v25.48k 修复：initialT 必须不平移！d3 zoom transform 是元素级平移, translate(+W/2, +H/2) 会把节点整体推到右下角 (1920, 1010) 接近, 左半空白 0-960. 现在用 d3.zoomIdentity (0,0) 原点, 节点坐标=渲染坐标, forceCenter 1.0 自然把质心拉到 (W/2, H/2). 用户原话 "为什么总是偏右" 终找到根因 */
const initialT = d3.zoomIdentity;
svg.call(zoom).call(zoom.transform, initialT);
svg.on("dblclick.zoom", null);
svg.on("dblclick", ()=> fitContent(60));  /* 双击复位 = fit 到全部 books */

/* 连线（轻） */
/* 连线按关系染色（透明 0.55 让差异可见但不抢戏）；浅色主题透明度 0.65（米白底上颜色不用太低） */
function relColor(rel){
  const c = REL_COLOR[rel] || "#9C928A";
  return c;
}
/* v25.38 连线三档（RC133）：跨书对偶连线最醒目（同色更亮一点，让用户看到关联根线）
   1) concept↔concept（任意两概念对偶）= 视觉中心，让用户一眼看到「先胜后战 ↔ 某概念」这种关联
   2) book↔book = 次强（说明两书关系）
   3) book↔concept = 最弱（仅是该书讲了该观点） */
function linkWidth(d){
  if(d.s.type==="book" && d.t.type==="book") return 2.0;
  if(d.s.type==="concept" && d.t.type==="concept") return 1.6;
  return 0.9;
}
function linkOpacity(d){
  if(d.s.type==="book" && d.t.type==="book") return dark ? 0.50 : 0.65;
  if(d.s.type==="concept" && d.t.type==="concept") return dark ? 0.58 : 0.72;
  return dark ? 0.48 : 0.60;   /* book↔concept 提高（v25.47 用户反馈：hover 时只看到一条亮线，要求书→概念点→另一本书的连线都看清） */
}
const link = viewport.append("g").attr("class","links")
  .selectAll("line").data(links).join("line")
  .attr("class","link")
  .attr("stroke", d => relColor(d.relation))
  .attr("stroke-opacity", linkOpacity)
  .attr("stroke-width", linkWidth)
  .attr("stroke-dasharray", d=> DASH.has(d.relation)?"6 4":null)
  .style("pointer-events","stroke")  /* v25.38 让 link 可接收 mouseover */
  .style("cursor","help")
  .on("mouseover",(e,d)=>{
    /* v25.38 hover link 显示来源书与对偶说明 */
    const bookLabel = x => x.type==="book" ? x.label : (x.book || "—");
    tip.innerHTML = `<b>${d.s.label}</b><span style="opacity:.55">（${bookLabel(d.s)}）</span> ↔ <b>${d.t.label}</b><span style="opacity:.55">（${bookLabel(d.t)}）</span>${d.concept?` · <span style="opacity:.7">${d.concept}</span>`:""}`;
    tip.style.display = "block";
    positionTip(e, tip);
  })
  .on("mousemove",(e)=>positionTip(e, tip))
  .on("mouseout",()=>{ tip.style.display="none"; });

/* 节点 —— 实色填充 + 细白描边（清亮，不灰头巴脸） */
const node = viewport.append("g").attr("class","nodes")
  .selectAll("g").data(nodes).join("g")
  .attr("class", d=> "node "+d.type+(d.status==="referenced"?" referenced":""))
  .call(d3.drag()
    .on("start",(e,d)=>{ if(e.sourceEvent) e.sourceEvent.stopPropagation(); if(!e.active)sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",(e,d)=>{ if(!e.active)sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.append("circle")
  .attr("r", radius)
  /* RC300 概念节点颜色继承所属书的 category：先查 concept.category == book.category 一致，否则按 n.book 回查 book 节点的 category 取色（v3 重分类 72 个 concept 没同步遗留） */
  .attr("fill", d=>{
    if(d.status==="referenced") return "#9C928A";
    const cat = CAT_COLOR[d.category] ? d.category : (d.type==="concept" && d.book ? ((nodeById.get(d.book)||{}).category) : null);
    return CAT_COLOR[cat] || "#888";
  })
  /* v25.38 取消跨类桥节点的特殊描边/金色发光 —— RC133：节点按 type 区分描边强度，与是否跨类无关 */
  .attr("stroke", d=> d.status==="referenced" ? null : (d.type==="book" ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.40)"))
  .attr("stroke-width", d=> d.status==="referenced" ? null : (d.type==="book" ? 2.2 : 0.8))
  .style("filter", d=> d.type==="book" ? "drop-shadow(0 0 7px rgba(255,255,255,0.32))" : null);

node.filter(d=>d.type==="book").append("text")
  .attr("text-anchor","middle").attr("dy", d=>radius(d)+17).text(d=>d.label);
/* v25.31 概念文字标签：全部都显示文字（user: "光秃秃的点儿上它有文字啊"）
   v25.38 取消跨类桥文字加亮加粗 —— RC133：所有 concept 平等 */
node.filter(d=>d.type==="concept").append("text")
  .attr("text-anchor","middle").attr("dy", 4)
  .style("font-size", "11px")
  .style("font-weight", 500)
  .style("fill", "rgba(232,230,226,0.8)")
  .text(d=>d.label);

const adj = new Map(nodes.map(n=>[n.id,new Set([n.id])]));
links.forEach(l=>{ if(l.s&&l.t){ adj.get(l.s.id).add(l.t.id); adj.get(l.t.id).add(l.s.id); } });

const tip = document.getElementById("tip");
/* 类别高亮筛选状态 —— 点类别按钮切换："全部" / "某一类"。hover 优先，mouseout 按此状态恢复 */
let selectedCategory = null;
function getCategoryHLSet(){
  const hl = new Set();
  if(!selectedCategory) return hl;
  nodes.filter(n => n.type==="book" && n.category === selectedCategory).forEach(b => hl.add(b.id));
  nodes.filter(n => n.type==="concept" && hl.has(n.book || n.books?.[0])).forEach(c => hl.add(c.id));
  return hl;
}
/* ===== v25.26 筛选交互（RC107：pan居中 + hl高亮 + 其他类 dim 遮罩）=====
   用户嘴里的"hover 那套遮罩逻辑搬到选类上来"——选某类时 hl 该类 + 其他类 dim（透明 0.12）
   hover 优先级更高：hover 节点时以邻接集合为 hl，类别状态作为底色
================================================================ */
let panT = null;
let currentHoverId = null;
function fitCategory(cat){
  if(!cat){
    if(panT){ svg.transition().duration(450).call(zoom.transform, initialT); panT = null; }
    return;
  }
  /* RC301 用 bounding box fit（不是单点重心）：取该类所有 book + concept 节点的最小包围盒，按比例缩放居中，确保整组都进屏幕、不是只露一个 */
  const set = nodes.filter(n => n.category === cat && isFinite(n.x) && isFinite(n.y));
  if(!set.length) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  set.forEach(n=>{
    const r = radius(n);
    if(n.x-r < minX) minX = n.x-r;
    if(n.x+r > maxX) maxX = n.x+r;
    if(n.y-r < minY) minY = n.y-r;
    if(n.y+r > maxY) maxY = n.y+r;
  });
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const boxW = maxX-minX, boxH = maxY-minY;
  if(boxW<=0 || boxH<=0) return;
  /* RC303 用户反复骂"搞那么小谁看得清"——fitCategory 不再缩小。
     只把 bbox 中心平移到屏幕中心，scale 取 max(当前, 1.0) 绝不主动拉远。
     组超出屏幕的让用户拖，绝不为他缩小。 */
  const cur = d3.zoomTransform(svg.node());
  const k = Math.max(cur.k, 1.0);
  const tx = W()/2 - cx*k, ty = H()/2 - cy*k;
  panT = d3.zoomIdentity.translate(tx,ty).scale(k);
  svg.transition().duration(500).call(zoom.transform, panT);
}
function updateVisual(){
  const catHL = getCategoryHLSet();
  const hoverHL = currentHoverId ? adj.get(currentHoverId) : null;
  const searchHLSet = searchHL ? new Set([searchHL]) : null;
  /* v25.30 hover 永远优先 —— 搜索只是临时定位，hover 到其他书时立刻显示其邻接关系，不被 searchHL 锁死 */
  const isHL = o => {
    if(hoverHL && hoverHL.has(o.id)) return true;
    if(!hoverHL && searchHLSet && searchHLSet.has(o.id)) return true;
    return catHL.has(o.id);
  };
  node.classed("hl", isHL);
  node.classed("dim", o => {
    if(hoverHL) return !hoverHL.has(o.id);
    if(searchHLSet) return !searchHLSet.has(o.id);
    if(selectedCategory) return !catHL.has(o.id);
    return false;
  });
  link.classed("dim", o => {
    if(hoverHL) return !(hoverHL.has(o.s.id) || hoverHL.has(o.t.id));
    if(searchHLSet) return !(o.s.id === searchHL || o.t.id === searchHL);
    if(selectedCategory) return !(catHL.has(o.s.id) || catHL.has(o.t.id));
    return false;
  });
}
/* tooltip 智能定位：默认右下贴边，右侧/下面超出则翻向  */
function positionTip(e, t){
  // 先放默认（右下 +14），display:block 已先设
  let x = e.clientX + 14, y = e.clientY + 14;
  t.style.left = x + "px";
  t.style.top = y + "px";
  const r = t.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  if (r.right > vw - 8)  t.style.left = Math.max(8, e.clientX - r.width - 14) + "px";
  if (r.bottom > vh - 8) t.style.top  = Math.max(8, e.clientY - r.height - 14) + "px";
}
node.on("mouseover",(e,d)=>{
    currentHoverId = d.id;
    updateVisual();
    let html = `<b>${d.label}</b>`;
    /* v25.32 hover tooltip 也走清洗（防御性兜底） */
    if(d.type==="book" && d.author){
      const au = (typeof cleanAuthorDisplay==="function") ? cleanAuthorDisplay(d.author) : d.author;
      if(au) html += ` <span style="opacity:.6">${au}</span>`;
    }
    tip.innerHTML = html;
    tip.style.display = "block";
    positionTip(e, tip);
  })
  .on("mousemove",(e)=>positionTip(e, tip))
  .on("mouseout",()=>{ tip.style.display="none"; currentHoverId = null; updateVisual(); });
/* 节点 click 在下方统一处理（打开卡片 + 阻止冒泡） */

sim.on("tick",()=>{
  link.attr("x1",d=>d.s.x).attr("y1",d=>d.s.y).attr("x2",d=>d.t.x).attr("y2",d=>d.t.y);
  node.attr("transform",d=>"translate("+d.x+","+d.y+")");
});

/* 主题切换：连线颜色按关系染色不变，透明度 / 描边暗度跟随主题微调 */
function applyTheme(isDark){
  dark = isDark;
  document.body.classList.toggle("light", !isDark);
  document.getElementById("themeBtn").textContent = isDark ? "切浅色" : "切深空";
  link.attr("stroke-opacity", linkOpacity);  /* v25.38 按 link 类型分层（concept↔concept 最亮、book↔book 中、book↔concept 暗）*/
}
applyTheme(true);
document.getElementById("themeBtn").addEventListener("click", ()=> applyTheme(!dark));

/* 关系色过滤 —— 整行已隐藏（RC124）。保留变量+空 hidden Set 避免后续 .link.style 报错。 */
const rels = Array.from(new Set(links.map(l=>l.relation)));
const fbox = d3.select("#relFilters");
const hidden = new Set();
/* 关系按钮整行已隐藏，不再渲染（用户原话："我不需要这些"） */

/* 分类图例 —— 默认无筛选（selectedCategory=null），点哪类突出哪类，再点同一类 / 点空白背景 = 取消 */
const dbox = d3.select("#domainLegend");
cats.forEach(c=>{
  const lab = dbox.append("label").attr("class","cat-btn").attr("data-cat",c).attr("title","点击突出该类别下的书与概念；再点一次或点空白处取消");
  lab.append("span").attr("class","dot").style("background",CAT_COLOR[c]||"#888");
  lab.append("span").text(c);
});
/* v25.30 点 svg 空白处 = 一键清掉所有筛选（类别 + 搜索 hl + 复位 pan）
   v25.37 修复：清的是图谱高亮，不是搜索作区——点空白不清空搜索框/下拉列表 */
let hadSelection = false;
svg.on("click", function(ev){
  hadSelection = !!(selectedCategory || searchHL);
  if(ev.target === this){
    if(selectedCategory){
      selectedCategory = null;
      dbox.selectAll(".cat-btn").classed("active", function(){ return (this.dataset.cat || "") === selectedCategory; });
    }
    if(searchHL){
      searchHL = null;   /* v25.37 只清图谱高亮，绝不清空搜索框和下拉列表 */
      if(centerNode._timer){ clearTimeout(centerNode._timer); centerNode._timer = null; }
    }
    if(hadSelection){ updateVisual(); /* 取消高亮即可，不复位 pan/zoom —— 用户明确反对点背景"蹦回去" */ }
  }
});
/* RC202 类别按钮统一 click handler：再点同一类 = 取消选中但镜头不动（只去掉高亮，回到看全部的状态）；切到新类才平移过去。
   v25.25 旧逻辑 fitCategory(selectedCategory) 取消时 selectedCategory=null 触发 fitContent 复位，违反"只有双击复位"原则。 */
dbox.selectAll(".cat-btn").on("click",function(ev){
  ev.stopPropagation();
  const cat = this.dataset.cat || null;
  const newCat = (cat && selectedCategory === cat) ? null : cat;  // 再点同一类=取消；点别的=切换
  selectedCategory = newCat;
  dbox.selectAll(".cat-btn").classed("active", function(){ return (this.dataset.cat || "") === selectedCategory; });
  updateVisual();
  if(selectedCategory) fitCategory(selectedCategory);  // 仅真选中才 pan；取消那一击镜头不动（用户原话"取消选择我看全部了，回到原位干嘛"）
});
/* 点节点时阻止冒泡到外层 svg（避免点 book 节点被同时当成"点空白取消"）*/
node.on("click", function(ev){
  const d = d3.select(this).datum();
  ev.stopPropagation();
  if(d && d.type==="book" && d.status!=="referenced"){
    const f = CARD_MAP[d.id];
    if(f) window.open(f,"_blank");
  }
});

/* 自适应 */
window.addEventListener("resize",()=>{
  cw = document.getElementById("wrap").clientWidth || window.innerWidth;
  ch = document.getElementById("wrap").clientHeight || (window.innerHeight - 70);
  if(cw < 400) cw = window.innerWidth || 1200;
  if(ch < 300) ch = (window.innerHeight - 70) || 800;
  svg.attr("width", W()).attr("height", H()).attr("viewBox", `0 0 ${W()} ${H()}`);
  sim.force("center",d3.forceCenter(W()/2,H()/2));
  sim.alpha(.3).restart();
});

/* v25.26 演示模式：?demo=<cat> 在 force simulation 稳定后自动 click 该类按钮，验证 hl/dim 效果 */
const _demo = new URLSearchParams(location.search).get('demo');
if(_demo){
  setTimeout(()=>{
    const btn = document.querySelector(`.cat-btn[data-cat="${_demo}"]`);
    if(btn) btn.click();
  }, 1200);
}

/* v25.29 搜索功能（移植自 thinking-model growth-brain）—— input 实时模糊匹配书名 + pan 居中 hl + dim 其他 */
let searchHL = null;
function nodeFillColor(n){
  if(n.type === "concept") return "#" + ((n.id || "x").split("").reduce((a,c)=>a + c.charCodeAt(0), 0) % 0xFFFFFF).toString(16).padStart(6,"0").slice(0,6);
  return CAT_COLOR[n.category] || "#888";
}
function centerNode(n){
  if(!n || !isFinite(n.x) || !isFinite(n.y)) return;
  searchHL = n.id;
  /* RC130 + RC125：centerNode 只做"居中+高亮"，绝不碰搜索输入框/下拉，避免污染用户的搜索状态 */
  const k = (svg.__zoom && svg.__zoom.k) || 0.95;
  const tx = W()/2 - n.x*k, ty = H()/2 - n.y*k;
  const t = d3.zoomIdentity.translate(tx, ty).scale(k);
  svg.transition().duration(550).call(zoom.transform, t);
  updateVisual();
  /* v25.30 自动清除：4s 后若鼠标不 hover 该节点，自动清 hl+dim，恢复原图可读；被 hover 打断则继续等 */
  if(centerNode._timer) clearTimeout(centerNode._timer);
  centerNode._timer = setTimeout(()=>{
    if(searchHL === n.id && !currentHoverId){
      searchHL = null;
      updateVisual();
    }
  }, 4000);
}
const searchInput = document.getElementById("searchInput");
const searchDropdown = document.getElementById("searchDropdown");

// v25.32 客户端清洗 author（防御性兜底：万一新插入节点没经过 Python 端清洗）
function cleanAuthorDisplay(a){
  if(!a) return '';
  a = String(a).trim();
  // 去前缀 [xx]
  while(true){
    const m = a.match(/^\[([^\]]+)\]\s*/);
    if(!m) break;
    a = a.slice(m[0].length);
  }
  if(a.includes('[')) a = a.split(' [')[0];
  // 多作者分隔
  for(const sep of [' / ',' /','/ ','／']){
    if(a.includes(sep)){ a = a.split(sep)[0]; break; }
  }
  for(const sep of ['、','，',',','；',';']){
    if(a.includes(sep)){ a = a.split(sep)[0]; break; }
  }
  for(const sep of [' 与 ',' 和 ',' & ',' &']){
    if(a.includes(sep)){ a = a.split(sep)[0]; break; }
  }
  // 含 · 后又含「与」「和」无空格的多作者
  if((a.includes('·')||a.includes('．'))){
    for(const sep of ['与','和']){
      if(a.includes(sep)){ a = a.split(sep)[0]; break; }
    }
  }
  a = a.replace(/\s*译\s*$/,'').replace(/\s*著\s*$/,'').replace(/\s*编\s*$/,'').replace(/\s*主编\s*$/,'');
  // 末端括号备注（如「菲利普·津巴多（Philip G. Zimbardo）」）
  a = a.replace(/[（(][^）)]*[）)]\s*$/,'');
  // ≥3 chunk 全纯中文 → 多作者，砍第一个
  const chunks = a.split(/\s+/);
  if(chunks.length >= 3 && !/[A-Za-z]/.test(chunks[0])) a = chunks[0];
  a = a.replace(/\s*等\s*$/,'');
  // v25.33 兜底：剩纯符号/空白视为空（防"/" "-" "—"等裸字符当 author）
  if(!/[\w\u4e00-\u9fff]/.test(a)) return '';
  return a.trim();
}

searchInput.addEventListener("input", ()=>{
  const q = searchInput.value.trim().toLowerCase();
  searchDropdown.innerHTML = "";
  searchHL = null;
  if(!q){ searchDropdown.style.display = "none"; updateVisual(); return; }
  /* v25.32 RC124 搜索源铁律：只匹配书名 label，绝不查 author/raw_label/category */
  const bookNodes = nodes.filter(n => n.type === "book");
  const matches = bookNodes.filter(n => {
    const lab = (n.label || "").toLowerCase();
    return lab.includes(q);
  }).slice(0, 12);
  if(!matches.length){
    searchDropdown.innerHTML = '<div class="searchEmpty">无匹配内容</div>';
  } else {
    matches.forEach(n => {
      const item = document.createElement("div");
      item.className = "searchItem";
      const dotColor = CAT_COLOR[n.category] || "#888";
      const au = cleanAuthorDisplay(n.author);
      const authorHtml = au ? `<span class="author">${au}</span>` : "";
      item.innerHTML = `<span class="dot" style="background:${dotColor}"></span><span class="name">${n.label}</span>${authorHtml}`;
      item.onclick = () => { centerNode(n); searchDropdown.style.display = "none"; };
      searchDropdown.appendChild(item);
    });
  }
  searchDropdown.style.display = "block";
});
searchInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter"){
    const q = searchInput.value.trim().toLowerCase();
    if(!q) return;
    /* v25.32 RC124: Enter 也只查 label */
    const n = nodes.filter(x => x.type === "book").find(x => {
      const lab = (x.label || "").toLowerCase();
      return lab.includes(q);
    });
    if(n){ centerNode(n); searchDropdown.style.display = "none"; }
  } else if(e.key === "Escape"){
    searchHL = null;
    searchInput.value = "";
    searchDropdown.style.display = "none";
    updateVisual();
  }
});
searchInput.addEventListener("focus", () => {
  if(searchInput.value.trim()) searchInput.dispatchEvent(new Event("input"));
});
document.addEventListener("click", (e) => {
  if(!document.getElementById("searchWrap").contains(e.target)) searchDropdown.style.display = "none";
});

/* v25.29 演示：?search=<q> 自动填入 + 触发 input (打开 dropdown) + 回车 (pan 居中) */
const _sq = new URLSearchParams(location.search).get('search');
if(_sq){
  setTimeout(()=>{
    const si = document.getElementById("searchInput");
    if(si){ si.value = _sq; si.dispatchEvent(new Event("input")); }
  }, 1500);
}
